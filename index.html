
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG UC XIZMAT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #101b16;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      text-align: center;
      padding: 15px;
      color: #35e58b;
      font-size: 23px;
      font-weight: bold;
    }
    .balance, .card {
      background: #1b2b23;
      border: 1px solid #315b43;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
    }
    .balance p { color: #b7c8bd; }
    .balance h2 {
      color: #35e58b;
      font-size: 27px;
    }
    h3 { color: #35e58b; }
    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    button {
      background: #20c875;
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      color: #071b10;
      font-weight: bold;
    }
    nav {
      display: flex;
      justify-content: space-around;
      gap: 5px;
      margin-top: 20px;
    }
    nav button { flex: 1; padding: 12px 5px; }
    .page { display: none; }
    .page.active { display: block; }
    .muted { color: #b7c8bd; }
  </style>
</head>
<body>

<header>🎮 PUBG UC XIZMAT</header>

<div class="balance">
  <p>💰 Hisobingiz balansi</p>
  <h2 id="balance">Yuklanmoqda...</h2>
  <button onclick="loadBalance()">🔄 Yangilash</button>
</div>

<div id="home" class="page active">
  <h3>🎮 PUBG UC</h3>

  <div class="card">
    <div>
      <b>60 UC</b>
      <p class="muted">PUBG Mobile</p>
    </div>
    <button onclick="buy('60 UC')">Tanlash</button>
  </div>

  <div class="card">
    <div>
      <b>325 UC</b>
      <p class="muted">PUBG Mobile</p>
    </div>
    <button onclick="buy('325 UC')">Tanlash</button>
  </div>

  <div class="card">
    <div>
      <b>660 UC</b>
      <p class="muted">PUBG Mobile</p>
    </div>
    <button onclick="buy('660 UC')">Tanlash</button>
  </div>

  <h3>💎 ML Diamonds</h3>
  <div class="card">
    <div>
      <b>86 Diamonds</b>
      <p class="muted">Mobile Legends</p>
    </div>
    <button onclick="buy('86 Diamonds')">Tanlash</button>
  </div>
</div>

<div id="orders" class="page">
  <h3>📦 Buyurtmalarim</h3>
  <p class="muted">Hozircha buyurtmalar mavjud emas.</p>
</div>

<div id="profile" class="page">
  <h3>👤 Profilim</h3>
  <p id="username">Telegram foydalanuvchisi</p>
  <p class="muted">PUBG UC XIZMAT</p>
</div>

<nav>
  <button onclick="showPage('home')">🏠 Bosh sahifa</button>
  <button onclick="showPage('orders')">📦 Buyurtmalar</button>
  <button onclick="showPage('profile')">👤 Profil</button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
  console.log("Telegram WebApp:", tg);
console.log("InitData:", tg?.initData);
tg?.ready();
tg?.expand();

if (tg?.initDataUnsafe?.user) {
  const user = tg.initDataUnsafe.user;
  document.getElementById('username').textContent =
    user.first_name || 'Telegram foydalanuvchisi';
}

async function loadBalance() {
  const balanceEl = document.getElementById('balance');

  if (!tg || !tg.initData) {
    balanceEl.textContent = 'Telegram orqali oching';
    return;
  }

  balanceEl.textContent = 'Yuklanmoqda...';

  try {
    const response = await fetch(
      'https://pubg-uc-xizmat-server.onrender.com/api/balance',
      {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({initData: tg.initData})
      }
    );

    const data = await response.json();

    if (!response.ok || !data.ok) {
      balanceEl.textContent = 'Balans yuklanmadi';
      return;
    }

    balanceEl.textContent =
      Number(data.balance).toLocaleString('uz-UZ') + ' so‘m';

  } catch (error) {
    balanceEl.textContent = 'Ulanishda xatolik';
  }
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(el => {
    el.classList.remove('active');
  });
  document.getElementById(page).classList.add('active');
}

function buy(product) {
  alert(product + ' tanlandi. Buyurtma berish hozircha sinov rejimida.');
}

loadBalance();
</script>

</body>
</html>
